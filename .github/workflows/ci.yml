name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # verification scripts covering current logic (scripts/ci-verify.mjs)
      - run: npm test
      - run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: check-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes
          fi
          notes="$(gh release view "$tag" --json body -q .body)"
          case "$notes" in
            *"docker pull ghcr.io/$GITHUB_REPOSITORY:$tag"*) ;; # already annotated
            *)
              {
                printf '%s\n' "$notes"
                printf '\n---\n\n'
                printf 'Image: `ghcr.io/%s:%s` (linux/amd64 + linux/arm64, also tagged `latest`)\n\n' "$GITHUB_REPOSITORY" "$tag"
                printf '```sh\ndocker pull ghcr.io/%s:%s\n```\n' "$GITHUB_REPOSITORY" "$tag"
              } > release-notes.md
              gh release edit "$tag" --notes-file release-notes.md
              ;;
          esac
